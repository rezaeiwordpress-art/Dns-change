name: Build Windows Installer

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies (Windows native packages)
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue package-lock.json
          npm install --no-audit --no-fund

      - name: Run TypeScript and frontend checks
        run: npm run lint

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows executable and installers
        run: npx tauri build

      - name: Upload Windows EXE and MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns-changer-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/dns-changer.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
